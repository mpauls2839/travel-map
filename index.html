<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
<title>UK Canal Route — Etruria to Great Haywood</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="map"></div>

  <div id="tabs" class="tabs" role="tablist" aria-label="Trip days"></div>

  <button id="sheet-handle" class="sheet-handle" aria-label="Toggle day details" aria-expanded="true">
    <span></span>
  </button>

  <aside id="panel" class="panel">
    <div class="panel-scroll">
      <div class="panel-header">
        <div class="panel-eyebrow" id="panel-eyebrow">DAY 1</div>
        <h1 id="panel-title">Loading…</h1>
        <p id="panel-summary" class="panel-summary"></p>
      </div>
      <div id="stop-list" class="stop-list"></div>
    </div>
  </aside>

  <button id="locate-btn" class="locate-btn" type="button" aria-label="Recenter on my location" hidden>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <circle cx="12" cy="12" r="3" fill="currentColor"/>
      <path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <circle cx="12" cy="12" r="7" stroke="currentColor" stroke-width="2"/>
    </svg>
  </button>

  <div id="loc-notice" class="loc-notice" hidden role="status"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
